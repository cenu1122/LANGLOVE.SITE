<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Chat, AI & Voice | DocBizHub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,Tahoma,sans-serif;background:#f4f6f9;color:#1e293b;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:#0f172a;color:#fff;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.logo{font-size:1.2rem;font-weight:bold;color:#fff;text-decoration:none}
.btn-back{background:#334155;color:#fff;text-decoration:none;padding:6px 14px;border-radius:6px;font-size:13px}
.main-layout{display:flex;flex:1;max-width:1300px;width:100%;margin:20px auto;gap:20px;padding:0 15px;overflow:hidden}
.sidebar{width:320px;background:#fff;border-radius:12px;border:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-section-title{padding:10px 15px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-weight:bold;font-size:12px;color:#64748b;text-transform:uppercase}
.room-list,.member-list{overflow-y:auto;max-height:170px;padding:8px;display:flex;flex-direction:column;gap:4px}
.room-item{padding:9px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:#334155}
.room-item:hover{background:#f1f5f9}.room-item.active{background:#3b82f6;color:white}
.member-item{padding:6px 10px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:10px;color:#334155}
.member-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid #cbd5e1}
.btn-new-room{margin:8px;padding:9px;background:#10b981;color:white;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
.chat-container{flex:1;background:#fff;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e2e8f0}
.chat-heading{padding:12px 18px;border-bottom:1px solid #e2e8f0;font-weight:600}
.chat-messages{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:#f8fafc}
.message-bubble{max-width:78%;padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.incoming{background:white;align-self:flex-start;border:1px solid #e2e8f0}.outgoing{background:#3b82f6;color:white;align-self:flex-end}
.msg-info{font-size:11px;margin-bottom:5px;opacity:.85;display:flex;justify-content:space-between;gap:14px}
.translated-tag{font-size:10px;background:rgba(0,0,0,.08);padding:2px 6px;border-radius:4px;margin-top:6px;display:inline-block}
.chat-input-area{padding:15px 20px;border-top:1px solid #e2e8f0;display:flex;gap:10px;align-items:center}
.chat-input-area input{flex:1;min-width:0;padding:12px 16px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
.btn-mic{background:#f1f5f9;border:1px solid #cbd5e1;width:42px;height:42px;border-radius:8px;cursor:pointer;font-size:18px}
.btn-mic.recording{background:#ef4444;color:white}.btn-send{background:#0f172a;color:white;border:0;padding:12px 22px;border-radius:8px;font-weight:bold;cursor:pointer}
.small-note{font-size:11px;color:#64748b;padding:0 12px 8px}
@media(max-width:760px){.main-layout{margin:8px auto;padding:0 8px;gap:8px}.sidebar{width:38%;min-width:125px}.chat-input-area{padding:9px;gap:5px}.btn-send{padding:11px}.chat-messages{padding:10px}.message-bubble{max-width:92%}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:15px"><a href="DASHBOARD.html" class="logo">⚡ Live Chat & Voice</a><span id="detectedLangBadge" style="font-size:12px;background:#1e293b;padding:4px 10px;border-radius:12px;color:#38bdf8">Jezik: ...</span></div>
  <a href="DASHBOARD.html" class="btn-back">🏠 Dashboard</a>
</header>
<div class="main-layout">
 <aside class="sidebar">
  <div class="sidebar-section-title">💬 Sobe i grupe</div>
  <div class="room-list" id="roomList"><div class="small-note">Učitavanje grupa...</div></div>
  <button class="btn-new-room" onclick="kreirajNovuGrupu()">+ Nova grupa</button>
  <div class="small-note">Grupe su zajedničke i čuvaju se u Supabase bazi.</div>
  <div class="sidebar-section-title" style="color:#b45309">✨ Novi članovi (12h)</div>
  <div class="member-list" id="noviClanoviList">Učitavanje...</div>
  <div class="sidebar-section-title" style="color:#059669">🟢 Online članovi</div>
  <div class="member-list" id="onlineClanoviList">Učitavanje...</div>
  <div class="sidebar-section-title">⚪ Offline članovi</div>
  <div class="member-list" id="offlineClanoviList">Učitavanje...</div>
 </aside>
 <main class="chat-container">
  <div class="chat-heading" id="roomHeading"># General</div>
  <div class="chat-messages" id="chatMessages"><div class="small-note">Učitavanje poruka...</div></div>
  <div class="chat-input-area">
   <input type="text" id="msgInput" placeholder="Napišite poruku..." onkeydown="handleKey(event)">
   <button class="btn-mic" id="btnMic" onclick="toggleSnimanjeGlasa()" title="Glasovni unos">🎙️</button>
   <button class="btn-send" onclick="posaljiPoruku()">Pošalji 🚀</button>
  </div>
 </main>
</div>
<script>
/*
  VAŽNO: Ovdje zalijepite SUPABASE anon/public key iz Project Settings > API.
  Nikada ne stavljajte service_role/secret key u HTML.
*/
const SUPABASE_URL = 'https://uduwpvdjmanrgpumdrfh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_IfX6dxz-ILfYK_3VgelcMw_tYOX0y45';

let db = null, mojId = null, korisnikIme = 'Korisnik', mojJezikIzBaze = 'bs';
let trenutnaSoba = null, trenutnaSobaId = null, recognition = null, isRecording = false;
let roomCache = [];

const langNames = {bs:'Bosnian', hr:'Croatian', sr:'Serbian', en:'English', de:'German', fr:'French', it:'Italian', es:'Spanish', tr:'Turkish', ar:'Arabic', nl:'Dutch', sv:'Swedish', pl:'Polish', ru:'Russian', zh:'Chinese', ja:'Japanese'};
function escapeHtml(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function avatar(name){return 'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(name||'User');}
function showError(message){console.error(message);alert(message);}
function getLangName(code){return langNames[String(code||'').toLowerCase()] || code || 'English';}

async function inicijalizujKorisnika(){
 if(!db) throw new Error('Supabase nije inicijalizovan. Provjerite anon/public key.');
 const {data:{user},error}=await db.auth.getUser();
 if(error) throw error;
 if(!user) throw new Error('Niste prijavljeni. Prijavite se pa otvorite chat.');
 mojId=user.id;
 const {data,error:profileError}=await db.from('UPOZNAVANJ_KORISNICI').select('*').or(`USER.eq.${user.id},MAIL.eq.${user.email}`).maybeSingle();
 if(profileError) console.warn('Profil nije učitan:',profileError.message);
 if(data){
  korisnikIme=data.IME||data.USERNAME||data.MAIL||korisnikIme;
  mojJezikIzBaze=String(data.JEZIK||data.language||'bs').toLowerCase();
 }
 document.getElementById('detectedLangBadge').textContent='Jezik: '+mojJezikIzBaze.toUpperCase();
 await db.from('UPOZNAVANJ_KORISNICI').update({is_online:true,last_seen:new Date().toISOString()}).or(`USER.eq.${user.id},MAIL.eq.${user.email}`);
}

async function ucitajGrupe(){
 const {data,error}=await db.from('chat_rooms').select('id,name,created_at,created_by').order('created_at',{ascending:true});
 if(error) throw error;
 roomCache=data||[];
 const list=document.getElementById('roomList'); list.innerHTML='';
 roomCache.forEach(room=>{
  const el=document.createElement('div'); el.className='room-item'+(room.id===trenutnaSobaId?' active':'');
  el.textContent='# '+room.name; el.onclick=()=>promijeniSobu(room.id,room.name,el); list.appendChild(el);
 });
 if(!trenutnaSobaId && roomCache.length) await promijeniSobu(roomCache[0].id,roomCache[0].name,list.firstElementChild);
 if(!roomCache.length) list.innerHTML='<div class="small-note">Još nema grupa.</div>';
}
async function promijeniSobu(roomId,naziv,element){
 trenutnaSobaId=roomId; trenutnaSoba=naziv;
 document.querySelectorAll('.room-item').forEach(el=>el.classList.remove('active'));
 if(element) element.classList.add('active');
 document.getElementById('roomHeading').textContent='# '+naziv;
 const {error}=await db.from('chat_room_members').upsert({room_id:roomId,user_id:mojId},{onConflict:'room_id,user_id',ignoreDuplicates:true});
 if(error) console.warn('Članstvo u grupi:',error.message);
 await ucitajPoruke();
}
async function kreirajNovuGrupu(){
 const naziv=(prompt('Unesite naziv nove grupe:')||'').trim();
 if(!naziv) return;
 if(naziv.length>60){alert('Naziv grupe može imati najviše 60 znakova.');return;}
 const {data,error}=await db.from('chat_rooms').insert({name:naziv,created_by:mojId,is_public:true}).select('id,name,created_at,created_by').single();
 if(error){showError('Ne mogu kreirati grupu: '+error.message);return;}
 const {error:memberError}=await db.from('chat_room_members').insert({room_id:data.id,user_id:mojId});
 if(memberError){showError('Grupa je kreirana, ali članstvo nije dodano: '+memberError.message);return;}
 await ucitajGrupe();
 const el=[...document.querySelectorAll('.room-item')].find(x=>x.textContent==='# '+data.name);
 await promijeniSobu(data.id,data.name,el);
}

async function ucitajClanoveSidebar(){
 const ids=['noviClanoviList','onlineClanoviList','offlineClanoviList'];
 if(!db)return;
 try{
  let all=[],from=0,step=500;
  while(true){
   const {data,error}=await db.from('UPOZNAVANJ_KORISNICI').select('*').range(from,from+step-1);
   if(error)throw error;
   all=all.concat(data||[]);
   if(!data||data.length<step)break;
   from+=step;
   if(from>=10000)break;
  }
  const fresh=[],online=[],offline=[],now=Date.now();
  all.forEach(u=>{
   const name=u.IME||u.USERNAME||u.MAIL||'Član';
   const pic=u.SLIKE_URL||u.slike_url||avatar(name);
   const created=u.CREATED_AT||u.created_at?new Date(u.CREATED_AT||u.created_at).getTime():0;
   const seen=u.last_seen?new Date(u.last_seen).getTime():0;
   const isNew=created>0 && now-created>=0 && now-created<=12*3600000;
   const isOnline=u.is_online===true && seen>0 && now-seen<300000;
   const item=`<div class="member-item"><img src="${escapeHtml(pic)}" class="member-avatar" onerror="this.src='${avatar(name)}'"><span>${escapeHtml(name)}</span></div>`;
   if(isNew)fresh.push(item);
   (isOnline?online:offline).push(item);
  });
  document.getElementById(ids[0]).innerHTML=fresh.join('')||'<div class="small-note">Nema novih članova.</div>';
  document.getElementById(ids[1]).innerHTML=online.join('')||'<div class="small-note">Nema aktivnih.</div>';
  document.getElementById(ids[2]).innerHTML=offline.join('')||'<div class="small-note">Nema offline članova.</div>';
 }catch(e){console.error('Učitavanje članova:',e);ids.forEach(id=>document.getElementById(id).innerHTML='<div class="small-note">Greška pri učitavanju. Provjerite RLS pravila.</div>');}
}

async function prevediTekst(tekst,ciljniJezik){
 const {data,error}=await db.functions.invoke('prevedi-poruku',{body:{tekst,ciljniJezik}});
 if(error)throw error;
 if(!data||!data.prijevod)throw new Error(data?.error||'Prevod nije vraćen.');
 return data.prijevod;
}
async function ucitajPoruke(){
 if(!db||!trenutnaSobaId)return;
 const {data,error}=await db.from('LIVE_CHAT_PORUKE').select('*').eq('ROOM_ID',trenutnaSobaId).order('CREATED_AT',{ascending:true}).limit(100);
 if(error){console.error('Učitavanje poruka:',error);return;}
 await prikaziPoruke(data||[]);
}
async function prikaziPoruke(poruke){
 const container=document.getElementById('chatMessages');
 container.innerHTML='';
 if(!poruke.length){container.innerHTML='<div class="small-note">Nema poruka u ovoj grupi. Budite prvi!</div>';return;}
 for(const msg of poruke){
  const own=msg.USER_ID===mojId || msg.KORISNIK===korisnikIme;
  let shown=msg.TEKST,translated=false,translationError='';
  const source=(msg.JEZIK||'').toLowerCase();
  if(source && source!==mojJezikIzBaze){
   try{shown=await prevediTekst(msg.TEKST,mojJezikIzBaze);translated=true;}
   catch(e){translationError='Prevod trenutno nije dostupan';console.warn(e);}
  }
  const bubble=document.createElement('div');bubble.className='message-bubble '+(own?'outgoing':'incoming');
  const info=document.createElement('div');info.className='msg-info';
  const sender=document.createElement('strong');sender.textContent=msg.KORISNIK||'Član';
  const speak=document.createElement('button');speak.type='button';speak.textContent='🔊';speak.title='Preslušaj';speak.style.cssText='border:0;background:transparent;cursor:pointer;color:inherit';
  speak.onclick=()=>procitajTekst(shown,mojJezikIzBaze);
  info.append(sender,speak);
  const body=document.createElement('div');body.textContent=shown;
  bubble.append(info,body);
  if(translated){const tag=document.createElement('div');tag.className='translated-tag';tag.textContent='🌐 Prevedeno na '+mojJezikIzBaze.toUpperCase();bubble.append(tag);}
  else if(translationError){const tag=document.createElement('div');tag.className='translated-tag';tag.textContent=translationError;bubble.append(tag);}
  container.appendChild(bubble);
 }
 container.scrollTop=container.scrollHeight;
}
async function posaljiPoruku(){
 const input=document.getElementById('msgInput'),tekst=input.value.trim();
 if(!tekst||!db||!trenutnaSobaId)return;
 const btn=document.querySelector('.btn-send');btn.disabled=true;
 const {error}=await db.from('LIVE_CHAT_PORUKE').insert({KORISNIK:korisnikIme,TEKST:tekst,JEZIK:mojJezikIzBaze,SOBA:trenutnaSoba,ROOM_ID:trenutnaSobaId,USER_ID:mojId,CREATED_AT:new Date().toISOString()});
 btn.disabled=false;
 if(error){showError('Poruka nije poslana: '+error.message);return;}
 input.value='';await ucitajPoruke();
}
function handleKey(e){if(e.key==='Enter'){e.preventDefault();posaljiPoruku();}}
function toggleSnimanjeGlasa(){
 const btn=document.getElementById('btnMic'),input=document.getElementById('msgInput');
 const API=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!API){alert('Ovaj preglednik ne podržava glasovni unos.');return;}
 if(isRecording){recognition?.stop();return;}
 recognition=new API();recognition.lang=({bs:'bs-BA',hr:'hr-HR',sr:'sr-RS',en:'en-US',de:'de-DE',fr:'fr-FR',it:'it-IT',es:'es-ES'}[mojJezikIzBaze]||'en-US');
 recognition.interimResults=false;
 recognition.onstart=()=>{isRecording=true;btn.classList.add('recording');input.placeholder='Slušam govor...';};
 recognition.onresult=e=>{input.value=e.results[0][0].transcript;};
 recognition.onerror=()=>zaustaviSnimanje();recognition.onend=()=>zaustaviSnimanje();recognition.start();
}
function zaustaviSnimanje(){isRecording=false;document.getElementById('btnMic').classList.remove('recording');document.getElementById('msgInput').placeholder='Napišite poruku...';}
function procitajTekst(text,lang){
 if(!('speechSynthesis'in window))return;
 const u=new SpeechSynthesisUtterance(text);u.lang=({bs:'bs-BA',hr:'hr-HR',sr:'sr-RS',en:'en-US',de:'de-DE',fr:'fr-FR',it:'it-IT',es:'es-ES'}[lang]||lang||'en-US');speechSynthesis.speak(u);
}
document.addEventListener('DOMContentLoaded',async()=>{
 try{
  if(!window.supabase)throw new Error('Supabase JS biblioteka nije učitana.');
  if(SUPABASE_ANON_KEY.includes('PASTE_YOUR'))throw new Error('U HTML ubacite svoj Supabase anon/public key.');
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  await inicijalizujKorisnika();await ucitajGrupe();await ucitajClanoveSidebar();
  setInterval(()=>{ucitajPoruke();},4000);
  setInterval(ucitajClanoveSidebar,15000);
 }catch(e){showError(e.message||String(e));}
});
</script>
</body>
</html>
