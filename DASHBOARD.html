<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DocBizHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0056b3;
            margin-top: 0;
        }
        .nav-links {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .nav-links a {
            display: block;
            padding: 12px 15px;
            background: #0056b3;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background: #004085;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dobrodošli na DocBizHub Dashboard</h1>
        <p>Ovo je centralna kontrolna tabla za upravljanje vašim alatima, panelima i sadržajem.</p>
        
        <div class="nav-links">
            <a href="FORUM.html">Forum</a>
            <a href="POSAO.html">Posao</a>
            <a href="PORUKE.html">Poruke</a>
            <a href="ZABAVA.html">Zabava</a>
            <a href="JEZICI.html">Jezici</a>
            <a href="PROFIL.html">Profil</a>
            <a href="KONTAKT.html">Kontakt</a>
        </div>
    </div>
</body>
</html>
